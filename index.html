<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">

    </head>


    
    <body style="background-color: rgb(0, 0, 0);">
        
        <div class="header">
            <div class="video-banner">
                <video autoplay loop muted>
                    <source src="videos/Showreel 2024 Website Cutdown 4000 kbps.webm">
                </video>
                <div class="video-overlay"></div>
            </div>

            <div class="header-text">
                <h1> Hi! I'm Louis (っ´ω｀)っ</h1>
                <h2>Let's create</h2>
            </div>

        </div>

        <div class="portfolio-grid">
            
            <div class="portfolio-item">
                <video autoplay loop muted src="videos/Alien Worm Thingy V2.webm" alt="Scenic mountain view">
            </div>



            <div class="portfolio-item">
                <img src="images/Beksinski 3 V1.3.webp" alt="Studio portrait photography">
            </div>

            <div class="portfolio-item">
                <img src="images/Beksinski Test.webp" alt="Digital vector art">
            </div>

            <div class="portfolio-item">
                <img src="images/Fährmann8.webp" alt="Minimalist product design">
            </div>

            <div class="portfolio-item">
                <img src="images/OaC Print Size.webp" alt="Branding concept logo">
            </div>

            <div class="portfolio-item">
                <img src="images/RSH18.webp" alt="Modern concrete architecture">
            </div>
            <div class="portfolio-item">
                <video autoplay loop muted src="videos/Particles Fun V1.webm" alt="Scenic mountain view">
            </div>
            <div class="portfolio-item">
                <img src="images/Dartthrowing2.webp" alt="Modern concrete architecture">
            </div>

            <div class="portfolio-item">
                <img src="images/Dartthrowing3.webp" alt="Modern concrete architecture">
            </div>

            <div class="portfolio-item">
                <img src="images/Fährmann.webp" alt="Modern concrete architecture">
            </div>

            <div class="portfolio-item">
                <img src="images/RSH21.webp" alt="Modern concrete architecture">
            </div>

            <div class="portfolio-item">
                <img src="images/Strange Plant CloseUp 8.webp" alt="Modern concrete architecture">
            </div>

        </div>

        <div id="lightbox" class="lightbox">
            <span class="lightbox-close">&times;</span>
            <img id="lightbox-img" src="" alt="Enlarged view">
            <video id="lightbox-video" autoplay loop muted src=""></video>
        </div>


    </body>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxVideo = document.getElementById('lightbox-video');
        
        // THE EXPANSION: Select both images and videos inside your portfolio items
        const portfolioMedia = document.querySelectorAll('.portfolio-item img, .portfolio-item video');
        
        // Active element tracker so our panning function knows whether it's moving an img or video
        let activeMedia = null;

        // 1. Open Lightbox when clicking any media asset
        portfolioMedia.forEach(media => {
            media.addEventListener('click', (e) => {
                // Prevent background video behaviors or link navigation glitches
                e.preventDefault(); 

                // Reset any leftover states
                lightboxImg.style.display = 'none';
                lightboxVideo.style.display = 'none';
                lightboxVideo.pause(); // Ensure video isn't playing hidden memory tracks

                // Check the tag type of the clicked item
                if (media.tagName === 'IMG') {
                    lightboxImg.src = media.src;
                    lightboxImg.style.display = 'block';
                    activeMedia = lightboxImg;
                } else if (media.tagName === 'VIDEO') {
                    // For videos, find the inner <source> src, or fallback to direct video src
                    const videoSrc = media.querySelector('source') ? media.querySelector('source').src : media.src;
                    lightboxVideo.src = videoSrc;
                    lightboxVideo.style.display = 'block';
                    lightboxVideo.load(); // Tells browser to fetch and buffer the video track
                    lightboxVideo.play();
                    activeMedia = lightboxVideo;
                }

                lightbox.style.display = 'flex'; 
            });
        });

        // 2. Handle Zoom Toggle and Closing
        lightbox.addEventListener('click', (e) => {
            // If the user clicked the active large media asset, toggle zoom
            if (e.target === activeMedia) {
                activeMedia.classList.toggle('zoomed');
                
                if (!activeMedia.classList.contains('zoomed')) {
                    activeMedia.style.transform = 'none';
                } else {
                    panMedia(e);
                }
            } else {
                // Shut down the lightbox cleanly
                lightbox.style.display = 'none';
                
                // Clean up and release system memory
                lightboxImg.src = "";
                lightboxVideo.src = "";
                lightboxVideo.pause();
                
                if (activeMedia) {
                    activeMedia.classList.remove('zoomed');
                    activeMedia.style.transform = 'none';
                }
                activeMedia = null;
            }
        });

        // 3. Panning Function
        lightbox.addEventListener('mousemove', (e) => {
            if (activeMedia && activeMedia.classList.contains('zoomed')) {
                panMedia(e);
            }
        });

        function panMedia(e) {
            const mouseXRatio = (e.clientX / window.innerWidth) - 0.5;
            const mouseYRatio = (e.clientY / window.innerHeight) - 0.5;

            const panRange = 50; 
            const translateX = -mouseXRatio * panRange;
            const translateY = -mouseYRatio * panRange;

            activeMedia.style.transform = `scale(2.0) translate(${translateX}%, ${translateY}%)`;
        }
    </script>
</html>
